  <a class="skip" href="#main">Skip to study activity</a>
  <header class="app-header">
    <button class="brand" type="button" data-nav="map" aria-label="SpeedCardio home"><span class="brand-mark" aria-hidden="true"></span>SpeedCardio</button>
    <nav aria-label="Study pages">
      <button type="button" data-nav="map" aria-current="page"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-map"/></svg>Map</button>
      <button type="button" data-nav="atlas"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-layers"/></svg>Atlas</button>
      <button type="button" data-nav="daily"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-calendar"/></svg>Daily<span id="due-badge" hidden></span></button>
      <button type="button" data-nav="theory"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-book"/></svg>Theory</button>
      <button type="button" data-nav="progress"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-chart"/></svg>Progress</button>
    </nav>
    <span id="header-streak" class="header-streak"></span>
  </header>
  <main id="main" tabindex="-1" data-enter>
    <p id="storage-status" class="storage-status" role="status" hidden>Progress is available for this session. This browser could not save it.</p>
    <section id="workspace" aria-label="Anatomy study" hidden>
      <div class="model-shell">
        <div class="model-head">
          <span id="model-label"></span>
          <span class="model-orient"><span id="model-angle"></span><span>L/R = patient’s</span></span>
          <button id="view-back" class="view-back" type="button" hidden><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-arrow-left"/></svg>Back to step view</button>
        </div>
        <div id="view" aria-label="3D anatomy model">
          <p id="model-status" role="status">Loading the 3D model…</p>
          <div id="view-fallback" role="status" hidden>
            <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
              <path d="M32 54 11 33C-4 18 16 2 32 18c16-16 36 0 21 15Z"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <span>3D view unavailable</span>
          </div>
          <span id="reticle" aria-hidden="true" hidden><svg class="icon" width="22" height="22" aria-hidden="true" focusable="false"><use href="#i-crosshair"/></svg></span>
        </div>
        <div id="view-toolbar" class="view-toolbar" hidden>
          <div class="view-group">
            <label class="view-select"><span><svg class="icon" width="15" height="15" aria-hidden="true" focusable="false"><use href="#i-compass"/></svg>View</span>
              <select id="view-direction" aria-label="Model viewpoint">
                <option value="ant">Anterior</option><option value="post">Posterior</option>
                <option value="dir">Right lateral</option><option value="esq">Left lateral</option>
                <option value="sup">Superior</option><option value="inf">Inferior</option>
              </select>
            </label>
            <button id="view-zoom-out" class="zoom" type="button" aria-label="Zoom out" title="Zoom out"><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-minus"/></svg></button>
            <button id="view-zoom-in" class="zoom" type="button" aria-label="Zoom in" title="Zoom in"><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
            <button id="view-reset" type="button" title="Reset the camera"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-rotate-ccw"/></svg>Reset view</button>
          </div>
          <div class="view-group">
            <button id="view-isolate" type="button" aria-pressed="false" title="Show only the highlighted structure"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-scan"/></svg>Isolate</button>
            <label class="view-ghost"><span><svg class="icon" width="15" height="15" aria-hidden="true" focusable="false"><use href="#i-layers"/></svg>Others</span>
              <input id="view-ghost" type="range" min="0" max="100" value="100" step="5" aria-label="Opacity of the other structures">
            </label>
            <button id="view-rotate" type="button" aria-pressed="false" title="Auto-rotate the model"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-rotate-cw"/></svg>Rotate</button>
          </div>
          <button id="pick-center" type="button" hidden><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-crosshair"/></svg>Pick at crosshair</button>
        </div>
      </div>
      <input id="typer" type="text" aria-label="Type the structure name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" hidden>
      <section id="practice" aria-label="Study prompt"></section>
    </section>
    <section id="page" aria-label="Study page"></section>
    <noscript>SpeedCardio needs JavaScript to run.</noscript>
  </main>

</body>
</html>
